<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0b1020"/>
            <stop offset="100%" stop-color="#151d36"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
        </pattern>
    </defs>

    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <circle cx="980" cy="120" r="240" fill="#818cf8" opacity="0.16"/>
    <circle cx="180" cy="560" r="220" fill="#22d3ee" opacity="0.12"/>

    <g transform="translate(90 150)">
        <rect width="92" height="92" rx="24" fill="url(#accent)"/>
        <text x="46" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#0b1020" text-anchor="middle">AT</text>

        <text x="0" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#eef2fb">Anushka Tyagi</text>
        <text x="0" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600" fill="url(#accent)">Software Engineer</text>
        <text x="0" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#8b95ad">Enterprise e-commerce systems &#183; Payments &#183; Marketplace &#183; POS</text>
        <text x="0" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#8b95ad">27+ international clients delivered to production</text>
    </g>
</svg>
